<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>学习项目工作台</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d8dee7;--blue:#2563eb;--blue2:#eff6ff;--green:#0f9f6e;--red:#b42318;--shadow:0 10px 28px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.good{background:var(--green);border-color:var(--green);color:#fff}.app{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}.top-inner{max-width:1320px;margin:auto;padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:800;display:flex;align-items:center;gap:9px}.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}.btns{display:flex;gap:8px;flex-wrap:wrap}.main{max-width:1320px;margin:auto;padding:24px 20px}.hero{background:linear-gradient(135deg,#fff,#f8fbff);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:18px;align-items:start}.home{grid-column:1/-1}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:18px}.side{position:sticky;top:78px}.side h3{margin:0 0 10px}.project-list{display:grid;gap:8px;max-height:560px;overflow:auto}.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left;width:100%}.item.active{border-color:var(--blue);background:var(--blue2)}.muted{color:var(--muted)}.small{font-size:12px}.progress{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);width:0}.empty{border:1px dashed #cfd7e3;border-radius:12px;padding:18px;color:var(--muted);text-align:center}.steps{display:grid;gap:12px}.step{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.step.done{border-color:#abefc6;background:#f7fffb}.step.current{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.10)}.stepHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.stepTitle{font-weight:800}.tag{border-radius:999px;padding:3px 8px;background:#f2f4f7;color:#475467;font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields.one{grid-template-columns:1fr}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-height:38px}.field textarea{min-height:110px;resize:vertical}.materialGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.material{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.material img{width:100%;height:104px;object-fit:cover;background:#f2f4f7}.materialBody{padding:9px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.outbox{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:12px;padding:14px;overflow:auto;max-height:70vh}footer{text-align:center;color:var(--muted);padding:24px}@media(max-width:980px){.grid{grid-template-columns:1fr}.side{position:static}.fields{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="top"><div class="top-inner"><div><div class="brand"><span class="dot"></span>学习项目工作台</div><div class="muted small">可持续学习平台：10步闭环 · 资料库 · 疑问复盘 · 最终速查表</div></div><div class="btns"><button id="newBtn" class="primary">新建项目</button><button id="exportJsonBtn">备份 JSON</button><button id="exportMdBtn">导出 Markdown</button><button id="exportHtmlBtn">导出 HTML</button><button id="importBtn">导入备份</button><input id="importInput" type="file" accept=".json" hidden></div></div></header><main class="main"><section class="hero home" id="home"><h1>我的学习项目</h1><p class="muted">每个项目都会记录日期、进度、十步学习流程、上传资料、疑问、待补研、最终报告和最终速查表。数据保存在浏览器 localStorage 中，可随时导出备份。</p><div class="btns"><button id="newBtn2" class="primary">开始新的学习项目</button></div></section><section class="grid" id="workspace" hidden><aside class="side panel"><div class="fields one"><div class="field"><label>项目名称</label><input id="projectName" placeholder="例如：外贸CRM获客平台"></div><div class="field"><label>标签</label><input id="projectTags" placeholder="逗号分隔"></div><div class="field"><label>状态</label><select id="projectStatus"><option>未开始</option><option>进行中</option><option>暂停</option><option>待补研</option><option>已完成</option></select></div><div class="field"><label>当前步骤</label><select id="currentStep"></select></div></div><h3>我的学习项目</h3><div id="projectList" class="project-list"></div></aside><section class="side-content panel"><div class="tabs"><button class="primary" data-tab="steps">十步流程</button><button data-tab="materials">资料库</button><button data-tab="report">最终文档</button><button data-tab="notes">疑问/待补研</button></div><div id="tabSteps" class="tabpane"><div class="fields"><div class="field"><label>开始日期</label><input id="startDate" type="date"></div><div class="field"><label>最近更新日期</label><input id="lastUpdated" type="date"></div><div class="field"><label>进度</label><input id="progress" type="range" min="0" max="100" value="0"><span id="progressText" class="small"></span></div></div><div class="steps" id="steps"></div></div><div id="tabMaterials" class="tabpane" hidden><div class="fields"><div class="field"><label>上传资料</label><input id="fileInput" type="file" accept=".md,.txt,.docx,.pdf,.png,.jpg,.jpeg" multiple></div><div class="field"><label>资料说明</label><input id="materialNote" placeholder="可选"></div></div><div id="materials" class="materialGrid"></div></div><div id="tabReport" class="tabpane" hidden><div class="fields one"><div class="field"><label>最终学习文档</label><textarea id="report" placeholder="这里汇总全书/全项目理解，并自动生成目录大纲和最终速查表"></textarea></div></div><button id="generateBtn" class="good">生成最终文档与最终速查表</button><div id="output" class="outbox">还没有生成文档。</div><button id="copyBtn" class="primary">复制生成结果</button></div><div id="tabNotes" class="tabpane" hidden><div class="fields one"><div class="field"><label>疑问 / 后续复盘 / 一眼回忆入口</label><textarea id="notes" placeholder="写清楚：哪里产生疑问、后续要补什么、以后从哪里继续看"></textarea></div></div><button id="saveNotesBtn" class="good">保存疑问与复盘</button></div></section></section><footer>本地保存 · 支持 Markdown / HTML / JSON 导出 · 支持 txt/md/docx/pdf/图片资料入库</footer></main></div><script>
const STEP_DEFS=[["01","主题定位","这个项目要解决什么问题？"],["02","知识地图","先画知识结构"],["03","原文提取","上传资料或粘贴原文"],["04","概念拆解","拆成可解释卡片"],["05","案例映射","用项目场景验证"],["06","疑问记录","写成明确问题"],["07","补研验证","补资料、补案例、补反证"],["08","复盘笔记","写能回看的理解"],["09","最终报告","汇总为完整文档"],["10","最终速查表","做成下次能直接查的清单"]];
const K='learning-workbench-v1';
const $=s=>document.querySelector(s); let state={projects:[],currentId:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString().slice(0,10);
function blankProject(name){return{id:uid(),name:name||'新的学习项目',tags:[],status:'进行中',currentStep:1,progress:1,startDate:now(),lastUpdated:now(),materials:[],steps:STEP_DEFS.map(()=>({content:''})),report:'',notes:'',createdAt:now()}}
function save(){localStorage.setItem(K,JSON.stringify(state))}
function load(){try{state=JSON.parse(localStorage.getItem(K)||'null')||state}catch(e){} if(!state.projects.length)state.projects=[blankProject('示例：学习项目工作台')]; if(!state.currentId)state.currentId=state.projects[0].id; if(!state.projects.find(p=>p.id===state.currentId))state.currentId=state.projects[0].id}
function cur(){return state.projects.find(p=>p.id===state.currentId)}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){save(); const p=cur(); $('#home').hidden=!!p; $('#workspace').hidden=!p; if(!p)return; $('#projectName').value=p.name; $('#projectTags').value=p.tags.join(', '); $('#projectStatus').value=p.status; $('#currentStep').innerHTML=STEP_DEFS.map((s,i)=>'<option value="'+(i+1)+'" '+(i+1===p.currentStep?'selected':'')+'>'+s[0]+' '+esc(s[1])+'</option>').join(''); $('#startDate').value=p.startDate; $('#lastUpdated').value=p.lastUpdated; $('#progress').value=p.progress; $('#progressText').textContent=p.progress+'%'; $('#report').value=p.report; $('#notes').value=p.notes; $('#steps').innerHTML=STEP_DEFS.map((s,i)=>{const idx=i+1,done=idx<p.currentStep||p.progress===100,current=idx===p.currentStep;return '<article class="step '+(done?'done ':'')+(current?'current':'')+'"><div class="stepHead"><div class="stepTitle">'+s[0]+' '+esc(s[1])+'</div><div><span class="tag">'+esc(s[2])+'</span> <button data-step="'+idx+'">设为当前</button></div></div><textarea data-stepcontent="'+idx+'" placeholder="记录第'+idx+'步成果">'+esc(p.steps[i].content)+'</textarea></article>'}).join(''); $('#projectList').innerHTML=state.projects.map(pr=>'<button class="item '+(pr.id===p.id?'active':'')+'" data-open="'+pr.id+'"><b>'+esc(pr.name)+'</b><div class="muted small">'+esc(pr.startDate)+' → '+esc(pr.lastUpdated)+' · 第'+pr.currentStep+'步 · '+pr.progress+'%</div><div class="progress"><span style="width:'+pr.progress+'%"></span></div><div class="muted small">'+esc(pr.tags.join(' / '))+'</div></button>').join(''); renderMaterials()}
function renderMaterials(){const p=cur(); if(!p)return; $('#materials').innerHTML=p.materials.length?p.materials.map((m,i)=>{const media=m.type&&m.type.indexOf('image/')===0?'<img src="'+m.dataUrl+'" alt="'+esc(m.name)+'">':'<div class="materialBody small muted">文件：'+esc(m.name)+'<br>'+((m.size/1024).toFixed(1))+' KB</div>';return '<div class="material">'+media+'<div class="materialBody"><b>'+esc(m.name)+'</b><div class="small muted">'+esc(m.date)+' · '+esc(m.note)+'</div><button data-material-delete="'+i+'">删除</button></div></div>'}).join(''):'<div class="empty">还没有资料，上传 txt/md/docx/pdf/图片后这里会显示。</div>'}
function addProject(){const p=blankProject(); state.projects.unshift(p); state.currentId=p.id; render(); $('#projectName').focus()}
function tab(name){['steps','materials','report','notes'].forEach(k=>{const id='tab'+k.charAt(0).toUpperCase()+k.slice(1); $('#'+id).hidden=(k!==name)})}
function generate(){const p=cur(); const materials=p.materials.map(m=>'- '+m.date+'｜'+m.name+'｜'+(m.note||'无说明')).join('
')||'- 暂无'; const questions=p.notes.split('
').filter(Boolean).map(x=>'- '+x).join('
')||'- 暂无'; p.report='# '+p.name+'

## 1. 项目信息
- 开始日期：'+p.startDate+'
- 最近更新：'+p.lastUpdated+'
- 状态：'+p.status+'
- 当前进度：'+p.progress+'%
- 标签：'+(p.tags.join(' / ')||'暂无')+'

## 2. 目录大纲
'+STEP_DEFS.map(s=>'- '+s[0]+' '+s[1]).join('
')+'

## 3. 资料库
'+materials+'

## 4. 十步学习过程
'+STEP_DEFS.map((s,i)=>'### '+s[0]+' '+s[1]+'
'+(p.steps[i].content||'待补充')).join('

')+'

## 5. 疑问与待补研
'+questions+'

## 6. 最终速查表
| 项目 | 内容 |
|---|---|
| 目标 | 持续学习并沉淀可复盘知识 |
| 当前阶段 | 第'+p.currentStep+'步：'+STEP_DEFS[p.currentStep-1][1]+' |
| 核心疑问 | '+questions+' |
| 下次入口 | 从当前步骤继续，补充资料后重跑最终报告 |
| 关键资料 | '+materials+' |'; render(); $('#output').textContent=p.report}
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
$('#newBtn').onclick=addProject; $('#newBtn2').onclick=addProject; document.body.addEventListener('click',e=>{const open=e.target.closest('[data-open]'); if(open){state.currentId=open.dataset.open; render(); tab('steps'); return} const set=e.target.closest('[data-step]'); if(set){cur().currentStep=Number(set.dataset.step); cur().progress=Math.max(cur().progress,Math.round((set.dataset.step/10)*100)); render(); return} const sc=e.target.closest('[data-stepcontent]'); if(sc){cur().steps[Number(sc.dataset.stepcontent)-1].content=sc.value; save(); return} const del=e.target.closest('[data-material-delete]'); if(del){cur().materials.splice(Number(del.dataset.materialDelete),1); renderMaterials(); save(); return}}); ['projectName','projectTags','projectStatus','currentStep','startDate','lastUpdated','progress','report','notes','materialNote'].forEach(id=>$('#'+id).addEventListener('input',e=>{const p=cur(); if(!p)return; const v=e.target.value; if(id==='progress')p.progress=Number(v); else if(id==='currentStep')p.currentStep=Number(v); else if(id==='projectTags')p.tags=v.split(',').map(x=>x.trim()).filter(Boolean); else p[id]=v; $('#progressText').textContent=p.progress+'%'; save(); render()})); $('#fileInput').addEventListener('change',e=>{const p=cur(); if(!p)return; [...e.target.files].forEach(f=>{const r=new FileReader(); r.onload=()=>{p.materials.push({id:uid(),name:f.name,type:f.type,size:f.size,date:now(),note:$('#materialNote').value,dataUrl:r.result,addedAt:new Date().toISOString()}); renderMaterials(); save()}; r.readAsDataURL(f)}); e.target.value=''}); document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab)); $('#generateBtn').onclick=generate; $('#copyBtn').onclick=async()=>await navigator.clipboard.writeText($('#output').textContent); $('#exportJsonBtn').onclick=()=>download('learning-workbench-backup.json',JSON.stringify(state,null,2),'application/json'); $('#exportMdBtn').onclick=()=>{const p=cur(); p.report=p.report||$('#report').value; download((p.name||'report').replace(/[\/:*?"<>|]+/g,'-')+'.md',p.report,'text/markdown')}; $('#exportHtmlBtn').onclick=()=>{const p=cur(); const body=p.report||$('#report').value; download((p.name||'report').replace(/[\/:*?"<>|]+/g,'-')+'.html','<!doctype html><meta charset="utf-8"><title>'+esc(p.name)+'</title><body><pre>'+esc(body)+'</pre>')}; $('#importBtn').onclick=()=>$('#importInput').click(); $('#importInput').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{state=JSON.parse(r.result); save(); render()}; r.readAsText(f)}); load(); render(); tab('steps');
</script></body></html>
